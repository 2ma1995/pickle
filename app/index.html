<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PICKLE 가안</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
/* 폰 한 대(390px) 안에서 도는 가안. 핵심 화면은 캐스팅 캘린더: 날짜마다 누가 나오는지 보이고, 배우를 고르면 그 배우 나오는 날만 켜진다. */
/* 디자인 토큰: Stitch 'Calm Editorial Precision'(DESIGN.md) — 흰 카드 · #F8F9FA 바탕 · 1px #E6E6E6 선 · 와인 #B23A48 하나 · 10px 모서리 · 그림자 없음 · Pretendard. 라이트 전용. */
:root{
  --bg:#F8F9FA; --fg:#141414; --muted:#5E5E5E; --faint:#8E8E93; --surface:#FFFFFF; --line:#E6E6E6; --soft:#F3F4F6; --divider:#F3F4F6; --outside:#F3F4F6; --dash:#D1D5DB;
  --ok:#2E7D5B; --warn:#9A6512; --accent:#B23A48; --accent-hover:#982F3B; --accent-soft:#FDF2F4; --accent-tint:#FBE8EA;
  --display:Pretendard,-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic",sans-serif; --font:Pretendard,-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --r1:#B23A48; --r2:#B23A48; --r3:#B23A48; --r4:#B23A48; --r5:#B23A48; --r6:#B23A48;  /* 배역색을 따로 쓰지 않고 강조색 하나로 */
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--font);font-size:14px;line-height:1.5;letter-spacing:-0.005em;-webkit-font-smoothing:antialiased}
/* 900px 미만: 앱 배치(하단 탭, 고정 버튼). 900px 이상: 웹 배치(상단 메뉴, 여러 칸). */
.shell{min-height:100vh;display:flex;flex-direction:column}
.top{position:sticky;top:0;z-index:5;display:grid;grid-template-columns:40px 1fr 40px;align-items:center;min-height:56px;padding:0 12px;background:var(--surface);border-bottom:1px solid var(--line)}
.top .brand{text-align:center;font-weight:800;font-size:18px;letter-spacing:-0.01em;color:var(--accent)}
.top .brand svg{vertical-align:-3px;margin-right:6px}
.top button{border:0;background:transparent;color:var(--fg);font-size:24px;line-height:1;padding:4px;border-radius:8px;cursor:pointer}
.top button[hidden]{visibility:hidden;display:block!important}
.topnav{display:none}
.steps{display:flex;gap:4px;flex-wrap:wrap;align-items:center;justify-content:center;padding:12px 16px 0;font-size:12px;color:var(--faint)}
.steps span{display:inline-flex;gap:4px;align-items:center;padding:4px 10px;border-radius:999px}
.steps span i{font-style:normal;font-size:10px;font-weight:700;letter-spacing:.04em}
.steps span.on{background:var(--accent-soft);color:var(--accent);font-weight:700}
.steps .sep{color:var(--dash);font-weight:400}
@media (max-width:599px){.steps{gap:0;flex-wrap:nowrap}.steps span{padding:4px 6px;white-space:nowrap}.steps span:not(.on) i{display:none}.steps .sep{font-size:10px}}
main{flex:1;width:100%;max-width:640px;margin:0 auto;padding:20px 20px 110px;display:grid;gap:16px;align-content:start}
.inline-cta{display:none}
h1,h2,h3{margin:0;font-weight:700;font-family:var(--display)}
h1{font-size:26px;line-height:1.3;letter-spacing:-0.02em}h2{font-size:20px;line-height:1.35;letter-spacing:-0.015em}h3{font-size:16px;line-height:1.4;font-weight:600;letter-spacing:-0.01em}
.eyebrow{margin:0 0 4px;font-size:11px;font-weight:700;letter-spacing:.04em;color:var(--accent)}
p{margin:0}
.muted{color:var(--muted)}.small{font-size:13px}.tiny{font-size:12px}.tiny.muted{color:var(--faint)}
a{color:inherit}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px;display:grid;gap:10px}
.card.accent{border-color:var(--accent)}
.card.picked{border-top:2px solid var(--accent)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chips:has(> .pair){display:grid;gap:6px}
.pair{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.pair .chip{justify-content:center;text-align:center;min-width:0}
.chip{border:1px solid var(--line);background:var(--surface);color:var(--muted);border-radius:10px;min-height:36px;padding:7px 14px;font-size:14px;font-weight:500;cursor:pointer;font-family:inherit;line-height:1.3;text-decoration:none;display:inline-flex;align-items:center;gap:4px}
.chip:hover{border-color:var(--dash)}
.chip.on{background:var(--accent-soft);border-color:var(--accent);color:var(--accent);font-weight:600}
.chip.role.on{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
.chip:disabled{opacity:.45;cursor:default}
.chip small{display:block;font-size:11px;opacity:.8}
.chip:has(small){flex-direction:column;align-items:flex-start;gap:0}
.chip .n{font-size:11px;opacity:.65;margin-left:5px}
.chip.x{min-height:32px;padding:5px 12px;font-size:13px}
.card>.chip.x{justify-self:end;align-self:flex-end;color:var(--muted)}
.tag{display:inline-block;font-size:12px;font-weight:500;padding:3px 8px;border-radius:6px;background:var(--soft);color:var(--muted)}
.tag.hit{background:var(--accent-tint);color:var(--accent);font-weight:600}
.tag.rc{background:var(--accent-tint);color:var(--accent)}
.btn{display:flex;align-items:center;justify-content:center;width:100%;min-height:48px;border:1px solid var(--accent);border-radius:10px;padding:10px 16px;font-size:15px;font-weight:600;background:var(--accent);color:#fff;cursor:pointer;font-family:inherit;text-align:center;text-decoration:none;letter-spacing:-0.005em}
.btn:hover{background:var(--accent-hover);border-color:var(--accent-hover)}
.btn.ghost{background:var(--surface);color:var(--fg);border:1px solid var(--line)}
.btn.ghost:hover{background:var(--bg)}
.btn.sm{min-height:40px;font-size:14px;padding:8px 12px}
.btn:disabled{background:var(--soft);border-color:var(--line);color:var(--faint);cursor:default}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.between{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
input,select{font:inherit;min-height:48px;padding:10px 14px;border:1px solid var(--line);border-radius:10px;background:var(--surface);color:var(--fg);width:100%}
input:focus,select:focus{outline:none;border-color:var(--accent)}
input::placeholder{color:var(--faint)}

/* 작품 그리드 */
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.work{position:relative;border-radius:10px;overflow:hidden;background:var(--surface);border:1px solid var(--line);cursor:pointer;display:grid;align-content:start}
.work:hover{border-color:var(--dash)}
.work.off{opacity:.55;cursor:default}
.poster{aspect-ratio:3/4;width:100%;object-fit:cover;display:block;background:var(--soft)}
.poster.type{display:grid;place-items:center;padding:14px;text-align:center;font-size:18px;font-weight:700;color:var(--muted);background:var(--line)}
.work{grid-template-rows:auto 1fr}
.work .info{padding:12px 12px 14px;display:flex;flex-direction:column;gap:4px}
.work .info b{font-size:16px;letter-spacing:-0.01em}
.work .info .tiny:last-of-type{margin-bottom:8px}
.work .go{margin-top:auto;display:flex;align-items:center;justify-content:center;min-height:36px;border:1px solid var(--line);border-radius:10px;font-size:13px;font-weight:600;color:var(--fg)}
.work:hover .go{border-color:var(--accent);color:var(--accent)}
.work .state{position:absolute;top:8px;left:8px;font-size:11px;font-weight:600;padding:3px 8px;border-radius:6px;background:#fff;color:var(--accent);border:1px solid var(--line)}

/* 작품 머리 */
.head{display:grid;grid-template-columns:64px 1fr;gap:12px;align-items:center}
.head .poster{width:64px;border-radius:8px;aspect-ratio:3/4}
.head .poster.type{font-size:13px;padding:6px}
.head.sm{grid-template-columns:44px minmax(0,1fr);gap:10px}
.head.sm .poster{width:44px}
.head.sm .poster.type{font-size:11px;padding:4px}
.head h2{overflow-wrap:anywhere}

/* 캘린더 */
.cal{display:grid;gap:6px}
.cal .mh{font-weight:700;margin-top:4px}
.dow,.days{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.dow span{text-align:center;font-size:11px;color:var(--muted)}
.dow span:nth-child(6){color:var(--r5)}.dow span:nth-child(7){color:var(--r4)}
.day{min-height:54px;border-radius:8px;padding:3px 2px 4px;background:var(--surface);border:1px solid var(--line);display:grid;align-content:start;gap:1px;cursor:default;position:relative}
.day.empty{background:transparent;border-color:transparent}
.day.none{background:transparent}
.day .n{font-size:11px;color:var(--muted);line-height:1.2;padding-left:2px}
.day.has{cursor:pointer}
.day.hit{border-color:var(--accent);background:var(--accent-soft)}
.day.pin{position:relative;border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent);opacity:1}
.day.pin::after{content:"✓";position:absolute;top:2px;right:4px;font-size:10px;font-weight:700;color:var(--accent)}
.day.peek{outline:2px solid var(--accent);outline-offset:-1px}
/* 화면 하나 = 질문 하나: 한 컬럼 */
.one{display:grid;gap:14px;width:100%;max-width:760px;margin:0 auto}
.peekbar{position:sticky;top:60px;z-index:3;padding:12px 14px;gap:6px}
.peekbar .row{gap:6px}
.day.hit .n{color:var(--fg);font-weight:700}
.day.dim{opacity:.4}
.day .s{font-size:10.5px;line-height:1.25;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:0 2px;border-radius:3px}
.day .s.m{color:var(--muted)}
.day .s.k{background:var(--accent);color:#fff}
.day .star{position:absolute;top:2px;right:3px;font-size:9px;color:var(--warn)}
.legend{font-size:12px;color:var(--muted)}

/* 바닥 시트 */
.sheet-bg{position:fixed;inset:0;background:rgba(10,8,16,.45);z-index:20;display:none}
.sheet-bg.on{display:block}
.sheet{position:fixed;left:50%;transform:translateX(-50%);bottom:0;width:100%;max-width:640px;max-height:78vh;overflow:auto;background:var(--bg);border-radius:20px 20px 0 0;padding:14px 16px 24px;z-index:21;display:none;box-shadow:0 -10px 40px rgba(0,0,0,.25)}
.sheet.on{display:grid;gap:12px}
.sheet .grab{width:40px;height:4px;border-radius:2px;background:var(--line);margin:0 auto 2px}
.show{display:grid;grid-template-columns:56px 1fr;gap:10px;align-items:start}
.show .t{font-weight:700;font-variant-numeric:tabular-nums}
.show .t small{display:block;font-weight:400;color:var(--muted);font-size:11px}

/* 추천 카드 */
.pick{display:grid;grid-template-columns:68px 1fr;gap:12px}
.rank{grid-column:1/-1;font-size:12px;letter-spacing:.06em;font-weight:700;color:var(--accent)}
.when{text-align:center;border-right:2px solid var(--accent);padding-right:10px;font-variant-numeric:tabular-nums;align-self:start}
.when .d{font-size:22px;font-weight:700;line-height:1;font-family:var(--display)}
.when .w{font-size:12px;color:var(--muted)}
.when .t{font-weight:700;margin-top:4px}
.when .badge{display:inline-block;margin-top:6px;font-size:11px;padding:2px 6px;border-radius:4px;background:var(--soft)}
.lead{font-size:16px}
.lead b{font-weight:500;font-size:12px;color:var(--muted);margin-right:2px}
.rest{font-size:13px;color:var(--muted)}
.why{list-style:none;margin:0;padding:0;display:grid;gap:6px;font-size:13px}
.why li{padding-left:10px;border-left:2px solid var(--line)}
.why .who{font-weight:700}
.why .tg{color:var(--accent);font-weight:500}
.why .src{color:var(--muted);font-size:12px}
.nodata{font-size:13px;color:var(--warn)}
/* 배역별 비교 카드: 정보 없는 배우도 같은 크기로 */
.cands{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.cand{border:1px solid var(--line);border-radius:10px;padding:12px;display:grid;gap:8px;align-content:start;cursor:pointer;min-width:0;background:var(--surface)}
.cand.on{border-color:var(--accent);background:var(--accent-soft)}
.cand.off{opacity:.45;cursor:default}
.cand.ex{border:1px dashed var(--dash);background:var(--bg);opacity:.6}
.cand.ex > :not(.nm):not(.avoid){opacity:.4}
.chip.avoid{justify-self:start;font-size:12px;padding:3px 9px}
.cand .nm{display:flex;justify-content:space-between;align-items:baseline;gap:6px}
.cand .nm b{font-size:15px}
.cand .q,.pa .q{font-size:12px;color:var(--muted);line-height:1.45;display:block;background:var(--bg);border-radius:8px;padding:8px 10px}
.q .qm{color:var(--accent);font-weight:800;margin-right:4px}
.cand .cnt{font-size:11px;font-weight:600;padding:2px 7px;border-radius:6px;background:var(--accent-soft);color:var(--accent);white-space:nowrap}
.cand .cnt.off{background:var(--soft);color:var(--faint)}
.cand .vote{font-size:11px;color:var(--accent);font-weight:700}
/* 영상 썸네일(탭하면 재생) */
.vth{position:relative;display:block;aspect-ratio:16/9;border-radius:8px;overflow:hidden;background:var(--line);text-decoration:none;color:inherit}
.vth img{width:100%;height:100%;object-fit:cover;display:block}
.vth .play{position:absolute;left:6px;bottom:6px;max-width:calc(100% - 12px);font-size:11px;line-height:1.3;padding:2px 7px;border-radius:999px;background:rgba(26,26,26,.72);color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.vth.none{display:grid;place-items:center;font-size:12px;color:var(--muted)}
.vrow{display:flex;gap:10px;align-items:center;font-size:13px;text-decoration:none;color:inherit}
.vrow img{width:96px;aspect-ratio:16/9;object-fit:cover;border-radius:6px;background:var(--line);flex-shrink:0}
/* 회차별 조합 카드: '갈 수 있는 날'마다 그날의 캐스트를 나란히. 순위·점수 없이 특성 차이만 보여 준다 */
.perf .when{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 8px;border-right:0;padding:0;text-align:left}
.perf .when .t,.perf .when .badge{margin:0}
.perf .leads{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;min-width:0}
.pa{display:grid;gap:6px;align-content:start;min-width:0}
.pa .th{display:grid;place-items:center;aspect-ratio:16/9;width:100%;border-radius:8px;background:var(--soft);color:var(--muted);font-size:11px;overflow:hidden}
.pa .th img{width:100%;height:100%;object-fit:cover;display:block}
.pa .nm{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:baseline;gap:0 6px}
.pa .nm b{font-size:15px}
.pa .q{font-size:12px;color:var(--muted);line-height:1.4}
.pa .clamp{display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.perf .acts{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.perf .acts .btn{padding:10px;font-size:14px}
details summary{cursor:pointer;color:var(--muted);font-size:14px}
details ul{margin:8px 0 0;padding-left:18px;font-size:14px;color:var(--muted)}
details li span{color:var(--fg)}
.actor{display:grid;gap:6px;padding:10px 0;border-top:1px solid var(--line)}
.actor:first-child{border-top:0}
.actor .name{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.actor .name>span:first-child{white-space:nowrap}
.actor .name>span:last-child{text-align:right}
.actor .name b{font-size:12px;color:var(--muted);font-weight:500;margin-right:6px}

/* 고정 CTA·탭 (앱 배치) */
.cta{position:fixed;left:50%;transform:translateX(-50%);bottom:64px;width:100%;max-width:640px;padding:10px 16px;background:linear-gradient(to top,var(--bg) 70%,transparent);z-index:4}
.tabs{position:fixed;bottom:0;left:0;right:0;width:100%;max-width:640px;margin:0 auto;display:grid;grid-template-columns:repeat(3,1fr);background:var(--surface);border-top:1px solid var(--line);z-index:5}
.tabs a{text-decoration:none;text-align:center;padding:10px 4px 14px;font-size:12px;color:var(--muted)}
.tabs a.on{color:var(--accent);font-weight:700}
.tabs a .ico{filter:grayscale(1);opacity:.7}.tabs a.on .ico{filter:none;opacity:1}
.tabs a .ico{display:block;font-size:18px}
.toast{position:fixed;left:50%;bottom:84px;transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:999px;font-size:14px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:30}
.toast.show{opacity:1}
pre{background:var(--soft);border-radius:10px;padding:10px;overflow-x:auto;font-size:11px;margin:0}
.score{display:flex;gap:6px}
.score .chip{flex:1;justify-content:center;text-align:center;padding:10px 0}
/* 저장 확인(#saved) · 관람 후(#tag) */
.okmark{width:72px;height:72px;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font-size:36px;font-weight:700;margin:8px auto 0}
.svh{text-align:center}
.svact{display:grid;gap:10px}
main[data-view=saved],main[data-view=tag]{max-width:640px}
.tmore>summary{list-style:none;display:flex;justify-content:space-between;align-items:center;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px 16px;color:var(--fg);font-size:14px;line-height:1.4}
.tmore>summary::-webkit-details-marker{display:none}
.tmore>summary::after{content:"＋";flex:none;color:var(--muted)}
.tmore[open]>summary{border-color:var(--accent);color:var(--accent)}
.tmore[open]>summary::after{content:"－";color:var(--accent)}
.tmore>div{display:grid;gap:16px;margin-top:16px}
/* QA(통합) CSS 보정 */
/* 내 공연 카드: V.plans가 카드에 작품별 --accent(작품 색)를 인라인으로 박아 버튼이 보라색으로 나온다. 토큰 하나(와인)로 되돌림. 근본 해결은 V.plans의 style 속성 삭제 */
#view .cards2>.card{--accent:inherit!important}
/* 날짜 화면의 본문 안 CTA는 웹(≥900)에서만. 마크업의 인라인 display:grid가 .inline-cta{display:none}을 이겨서 폰·태블릿에서 하단 고정 버튼과 두 개로 보인다 */
.inline-cta{display:none!important}
@media (min-width:900px){.inline-cta{display:grid!important}}
/* 폰·태블릿: 하단 고정 버튼(#cta)이 떠 있을 땐 본문 끝(각주)이 버튼에 가려지지 않게 여백을 더 준다 */
@media (max-width:899px){main:has(~ #cta:not([hidden])){padding-bottom:150px}}
.flow{display:grid;gap:6px;font-size:13px;color:var(--muted)}
.flow div{display:grid;grid-template-columns:22px 1fr;gap:8px}
.flow i{font-style:normal;font-weight:700;color:var(--accent)}
.side,.mainc{display:grid;gap:16px;min-width:0}
.side{scroll-margin-top:60px}

/* 누구(pick) · 언제(when) */
.pickgrid{display:grid;gap:14px}
.pside,.pmain{display:grid;gap:14px;align-content:start;min-width:0}
.cbtns{display:grid;grid-template-columns:1fr auto;gap:6px;align-items:center}
.cbtns .btn.sm{min-height:36px;font-size:13px}
.grp{gap:12px}
.grp.seen{opacity:.75}
.pickb{display:inline-block;font-size:10px;font-weight:700;letter-spacing:.04em;padding:3px 6px;border-radius:4px;background:var(--accent);color:#fff;vertical-align:2px}
.cntp{font-size:12px;font-weight:600;color:var(--muted);background:var(--soft);padding:3px 8px;border-radius:6px;white-space:nowrap}
.whybox{background:var(--accent-soft);border-radius:10px;padding:10px 12px}
.whybox.plain{background:var(--bg)}
.whybox>summary{list-style:none;display:flex;justify-content:space-between;align-items:center;gap:8px;color:var(--accent);font-weight:600;font-size:13px;cursor:pointer}
.whybox.plain>summary{color:var(--muted)}
.whybox>summary::-webkit-details-marker{display:none}
.whybox .pill{flex:none;font-size:12px;font-weight:600;background:#fff;border:1px solid var(--line);border-radius:6px;padding:3px 8px;color:var(--fg)}
.whybox[open] .why{margin-top:10px}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.tile{display:grid;gap:4px;padding:12px;border:1px solid var(--line);border-radius:10px;background:var(--surface);text-decoration:none;color:inherit}
.tile:hover{border-color:var(--accent)}
.tile .lab{font-size:11px;font-weight:600;color:var(--faint)}
.tile .lab.sp{color:var(--accent)}
.tile .tm{font-size:12px;font-weight:600;background:var(--soft);border-radius:6px;padding:2px 6px;font-variant-numeric:tabular-nums}
.tile .dt{font-size:18px;font-weight:700;letter-spacing:-0.01em;font-variant-numeric:tabular-nums}
.tile .meta{font-size:12px;color:var(--faint);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tile .go{margin-top:6px;display:flex;justify-content:center;align-items:center;min-height:34px;border-radius:8px;background:var(--bg);font-size:12px;font-weight:600}
.tile.seen{background:var(--bg);border-style:dashed;border-color:var(--dash)}
.tile.seen .dt{color:var(--faint);text-decoration:line-through}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;background:var(--soft);border-radius:10px;padding:3px;gap:3px}
.seg button{border:1px solid transparent;background:transparent;border-radius:8px;min-height:40px;font:inherit;font-weight:600;color:var(--muted);cursor:pointer}
.seg button.on{background:#fff;border-color:var(--line);color:var(--fg)}
.seg button b{color:var(--accent);margin-left:6px}
.moods{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.mood{display:grid;gap:2px;justify-items:start;text-align:left;padding:12px;border:1px solid var(--line);border-radius:10px;background:#fff;cursor:pointer;font:inherit;color:var(--fg)}
.mood .em{font-size:24px;line-height:1.2}
.mood b{font-size:14px}
.mood small{font-size:11px;color:var(--faint)}
.mood.on{border-color:var(--accent);background:var(--accent-soft)}
.mood.on b{color:var(--accent)}
.bar{height:6px;border-radius:999px;background:var(--soft);overflow:hidden}
.bar span{display:block;height:100%;background:var(--accent)}
@media (min-width:900px){
  .one.wide{max-width:none}
  .pickgrid{grid-template-columns:320px minmax(0,1fr);gap:24px;align-items:start}
  .pside{position:sticky;top:84px}
}

/* 태블릿: 앱 배치(하단 탭) 그대로, 폭만 넓게 쓴다 */
@media (min-width:640px) and (max-width:899px){
  main{max-width:900px;padding-inline:24px}
  .cta,.tabs,.sheet{max-width:900px}
  main[data-view=works] .grid{grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:16px}
  .cards2{display:grid;grid-template-columns:1fr 1fr;gap:16px;align-items:start}
  .cal{grid-template-columns:1fr 1fr;gap:16px;align-items:start}
  .cal > h3,.cal > .legend,.cal > .tiny{grid-column:1/-1}
  .picks{display:grid;grid-template-columns:1fr 1fr;gap:16px;align-items:start}
  .day{min-height:64px}
  .day .s{font-size:11.5px}
}

/* 웹 배치 */
@media (min-width:900px){
  .shell{max-width:1160px;margin:0 auto;padding-inline:24px}
  .top{grid-template-columns:40px auto 1fr;gap:16px;padding:14px 0}
  .top .brand{text-align:left;font-size:21px}
  .topnav{display:flex;gap:4px;justify-self:end}
  .topnav a{text-decoration:none;color:var(--muted);padding:8px 14px;border-radius:999px;font-size:14px}
  .topnav a.on{background:var(--soft);color:var(--fg);font-weight:700}
  .tabs,.cta{display:none!important}
  .inline-cta{display:grid}
  .steps{justify-content:flex-start;padding:12px 0 0}
  main{max-width:none;padding:24px 0 64px;gap:24px}
  main[data-view=works] .grid{grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:20px}
  .cards2{display:grid;grid-template-columns:repeat(auto-fit,minmax(340px,1fr));gap:16px;align-items:start}
  .cal{grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:20px;align-items:start}
  .cal > h3,.cal > .legend,.cal > .tiny{grid-column:1/-1}
  .day{min-height:72px}
  .day .s{font-size:12px}
  .picks{display:grid;grid-template-columns:repeat(auto-fit,minmax(400px,1fr));gap:16px;align-items:start}
  main[data-view=detail]{grid-template-columns:minmax(0,1fr) 380px;align-items:start}
  main[data-view=detail] .side{position:sticky;top:84px}
  .sheet{bottom:auto;top:50%;transform:translate(-50%,-50%);max-width:600px;border-radius:20px;max-height:80vh}
  .toast{bottom:40px}
}
</style>
</head>
<body>
<div class="shell">
  <header class="top">
    <button id="back" aria-label="뒤로">‹</button>
    <div class="brand"><a href="../" style="text-decoration:none;color:inherit" title="소개 페이지로"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 7a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2v3a2 2 0 0 0 0 4v3a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-3a2 2 0 0 0 0-4z"/><path d="M13 5v2M13 11v2M13 17v2"/></svg>PICKLE</a></div>
    <nav class="topnav">
      <a href="#works" data-tab="home">작품 탐색</a>
      <a href="#plans" data-tab="plans">내 공연</a>
      <a href="#me" data-tab="me">내 취향</a>
    </nav>
  </header>
  <div class="steps" id="steps"></div>
  <main id="view"></main>
  <div class="cta" id="cta" hidden></div>
  <nav class="tabs" id="tabs">
    <a href="#works" data-tab="home"><span class="ico">🎭</span>작품</a>
    <a href="#plans" data-tab="plans"><span class="ico">🎟️</span>내 공연</a>
    <a href="#me" data-tab="me"><span class="ico">✦</span>내 취향</a>
  </nav>
  <div class="toast" id="toast"></div>
</div>
<div class="sheet-bg" id="sheetbg"></div>
<div class="sheet" id="sheet"></div>

<script src="data.js?v=202610071407"></script>
<script>
const D = window.PICKLE_DATA;
const $ = (s, el = document) => el.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const STEP_NAMES = ["작품", "누구", "언제", "상세", "관람 후"];  // 캐스트를 먼저 정하고 날짜를 찾는다(설문 64.9%). 화면 하나 = 질문 하나
const ROLE_COLORS = ["var(--r1)", "var(--r2)", "var(--r3)", "var(--r4)", "var(--r5)", "var(--r6)"];

// ---------- 상태 (이 브라우저에만 저장) ----------
const KEY = "pickle_v2";
let S = {prefs: null, query: null, cal: {}, plans: [], tags: [], votes: []};  // votes: 같은 배역 두 배우 비교 투표
try { S = Object.assign(S, JSON.parse(localStorage.getItem(KEY) || "{}")); } catch (e) {}
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} };

// 내가 남긴 관람 태그를 추천 데이터에 합친다 (앱의 핵심 루프)
function mergeMyTags() {
  for (const t of S.tags) {
    if (!t.actor) continue;  // 기분(mood)만 남긴 기록은 추천 데이터에 합칠 게 없다
    for (const tag of t.tags) {
      const rows = ((D.actorTags[t.work] ||= {})[t.actor] ||= []);  // 태그가 있을 때만 배우 항목을 만든다(빈 배열을 남기지 않게)
      if (!rows.some(r => r.tag === tag && r.src === "내 관람"))
        rows.push({role: t.role, tag, why: t.note || "내가 보고 남긴 태그", src: "내 관람", season: "2026", link: "", show: `${t.date} ${t.time}`});
    }
    if (t.partner) for (const tag of t.combo) {
      const list = (D.comboTags[t.work] ||= []);
      if (!list.some(r => r.tag === tag && r.src === "내 관람" && r.a === t.actor && r.b === t.partner))
        list.push({a: t.actor, b: t.partner, role: "조합", tag, why: t.note || "내가 보고 남긴 태그", src: "내 관람", season: "2026", link: "", show: ""});
    }
  }
}
mergeMyTags();

// ---------- 추천 규칙 (recommend.py와 동일) ----------
function wantSet(prefs) { const out = new Set(); for (const p of prefs) for (const t of (D.axis[p] || [p])) out.add(t); return out; }
function pinsByRole(work, actors) {  // 같은 배역은 '또는', 배역끼리는 '그리고'
  const pins = {};
  for (const r of (D.roles[work] || [])) for (const a of r.cast) if (actors.includes(a)) (pins[r.role] ||= []).push(a);
  return pins;
}
// avoid: 사용자가 직접 뺀 배우. 감점이 아니라 그 배우가 나오는 회차를 후보에서 지운다(하드 필터).
function passes(p, pins, avoid = []) { return !Object.values(p.cast).some(a => avoid.includes(a)) && Object.entries(pins).every(([role, as]) => as.includes(p.cast[role])); }
function recommend(work, lo, hi, prefs, actors = [], top = 2, avoid = []) {
  const want = wantSet(prefs), pins = pinsByRole(work, actors);
  const groups = new Map();
  for (const p of D.perfs) {
    if (p.work !== work || p.date < lo || p.date > hi || !passes(p, pins, avoid)) continue;
    const key = Object.entries(p.cast).sort().map(e => e.join(":")).join("|");
    if (!groups.has(key)) groups.set(key, {cast: p.cast, shows: []});
    groups.get(key).shows.push(p);
  }
  const ranked = [];
  for (const g of groups.values()) {
    let pts = 0, known = 0; const ev = [], unknown = [];
    for (const [role, a] of Object.entries(g.cast)) {
      const rows = (D.actorTags[work] || {})[a] || [];
      known += rows.length;
      if (!rows.length) { unknown.push({a, role}); continue; }
      for (const r of rows) if (want.has(r.tag)) { pts++; ev.push({who: a, role, ...r}); }
    }
    const names = Object.values(g.cast);
    for (const c of (D.comboTags[work] || [])) if (names.includes(c.a) && names.includes(c.b) && want.has(c.tag)) { pts++; ev.push({who: `${c.a}×${c.b}`, role: "조합", ...c}); }
    g.shows.sort((x, y) => (x.date + x.time).localeCompare(y.date + y.time));
    ranked.push({...g, pts, known, ev, unknown});
  }
  ranked.sort((x, y) => y.pts - x.pts || y.known - x.known || (x.shows[0].date + x.shows[0].time).localeCompare(y.shows[0].date + y.shows[0].time));
  const picks = ranked.filter(g => g.pts > 0).slice(0, top);
  return {ranked, picks, others: ranked.filter(g => !picks.includes(g)), want, pins};
}

// ---------- 도우미 ----------
const workOf = name => D.works.find(w => w.name === name);
const leadRoles = work => (D.roles[work] || []).filter(r => r.weight === "주연");
const roleColor = (work, role) => ROLE_COLORS[Math.max(0, (D.roles[work] || []).findIndex(r => r.role === role)) % ROLE_COLORS.length];
const weightOf = (work, role) => (D.roles[work] || []).find(r => r.role === role)?.weight || "조연";
const leads = (work, cast) => Object.entries(cast).filter(([r]) => weightOf(work, r) === "주연");
const rests = (work, cast) => Object.entries(cast).filter(([r]) => weightOf(work, r) !== "주연");
const md = d => `${+d.slice(5, 7)}/${+d.slice(8, 10)}`;
// 공연(run): 같은 작품의 서울·지방 공연. 회차는 날짜로 어느 공연인지 정해진다.
const runsOf = work => { const w = workOf(work); if (!w) return []; const live = w.runs.filter(r => r.end >= today()); return live.length ? live : w.runs; };
const runOf = (work, date) => { const w = workOf(work); if (!w) return null; return w.runs.find(r => date >= r.start && date <= r.end) || runsOf(work)[0]; };
const fmtPeriod = r => `${md(r.start)} ~ ${r.end.slice(0, 4) !== r.start.slice(0, 4) ? r.end.slice(0, 4) + " " : ""}${md(r.end)}`;
const perfsOf = (work, run) => D.perfs.filter(p => p.work === work && (!run || (p.date >= run.start && p.date <= run.end)));
const dateRange = (work, run) => { const ds = perfsOf(work, run).map(p => p.date); return ds.length ? [ds.reduce((a, b) => a < b ? a : b), ds.reduce((a, b) => a > b ? a : b)] : null; };
// 날짜는 전부 로컬(한국) 기준 문자열 YYYY-MM-DD. toISOString은 UTC라 하루가 밀리므로 쓰지 않는다.
const fmt = x => `${x.getFullYear()}-${String(x.getMonth() + 1).padStart(2, "0")}-${String(x.getDate()).padStart(2, "0")}`;
const today = () => fmt(new Date());
const addDays = (d, n) => { const x = new Date(d + "T00:00:00"); x.setDate(x.getDate() + n); return fmt(x); };
const endOfMonth = d => { const x = new Date(d + "T00:00:00"); x.setMonth(x.getMonth() + 1, 0); return fmt(x); };
const firstOfNextMonth = d => { const x = new Date(d + "T00:00:00"); x.setMonth(x.getMonth() + 1, 1); return fmt(x); };
const mx = (a, b) => a > b ? a : b, mn = (a, b) => a < b ? a : b;
const PERIODS = [["weekend", "이번 주말"], ["2w", "2주 안"], ["month", "이번 달"], ["next", "다음 달"], ["all", "전체"]];
function periodRange(key, work, run) {
  const [lo0, hi0] = dateRange(work, run), t = today(), base = mx(t, lo0);
  if (key === "weekend") { const dow = new Date(t + "T00:00:00").getDay(); const sat = dow === 0 ? addDays(t, -1) : addDays(t, 6 - dow); return [mx(sat, lo0), mn(addDays(sat, 1), hi0)]; }
  if (key === "2w") return [base, mn(addDays(base, 14), hi0)];
  if (key === "month") return [base, mn(endOfMonth(base), hi0)];
  if (key === "next") { const f = firstOfNextMonth(base); return [mx(f, lo0), mn(endOfMonth(f), hi0)]; }
  return [lo0, hi0];
}
function setAccent() {}  // 작품별 색을 쓰지 않는다. 강조색은 토큰 하나(--accent)
let toastT; function toast(msg) { const t = $("#toast"); t.textContent = msg; t.classList.add("show"); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove("show"), 1800); }
const posterEl = (w, cls = "poster") => w.poster ? `<img class="${cls}" src="${esc(w.poster)}" alt="${esc(w.name)} 포스터">` : `<div class="${cls} type" style="--accent:${esc(w.accent)}">${esc(w.name)}</div>`;
function whenTile(p) {
  const badges = p.notes.filter(n => /첫공|막공|폐막|프리뷰|마티네|스윙/.test(n)).map(n => `<span class="badge">${esc(n.length > 14 ? n.slice(0, 12) + "…" : n)}</span>`).join("");
  return `<div class="when"><div class="d">${md(p.date)}</div><div class="w">${esc(p.dow)}요일</div><div class="t">${esc(p.time)}</div>${badges}</div>`;
}
// 다른 작품 리뷰에서 가져온 목소리 태그는 출처 뒤에 "OO 리뷰 기준"을 붙인다(recommend.py가 from을 단다)
const srcLabel = r => r.src + (r.from ? `, ${r.from} 리뷰 기준` : "");
const evidenceList = ev => `<ul class="why">${ev.map(e => `<li><span class="who">${esc(e.who)}</span> · <span class="tg">${esc(e.tag)}</span> — ${esc(e.why)} <span class="src">${esc(srcLabel(e))}${e.season && e.season !== "2026" ? `, ${esc(e.season)} 시즌` : ""}${e.link ? ` <a href="${esc(e.link)}" target="_blank" rel="noopener">출처</a>` : ""}</span></li>`).join("")}</ul>`;
const won = n => n.toLocaleString("ko-KR") + "원";
const views = n => n >= 10000 ? `${(n / 10000).toFixed(n >= 100000 ? 0 : 1)}만` : n.toLocaleString("ko-KR");
const videoOf = (work, a) => (((D.videos || {})[work] || {})[a] || [])[0];  // 공식 채널 우선으로 정렬돼 있어서 첫 번째가 대표 영상
const videoLink = (v, cls = "q") => `<a class="${cls}" href="${esc(v.url)}" target="_blank" rel="noopener">▶ ${esc(v.title.length > 38 ? v.title.slice(0, 38) + "…" : v.title)} <span class="muted">· ${esc(v.channel)}${v.official ? " · 공식" : ""}${v.views ? ` · 조회 ${views(v.views)}` : ""}</span></a>`;
const ytIdOf = v => (v?.url || "").match(/[?&]v=([\w-]+)/)?.[1];
// 글자 링크 대신 썸네일을 누르게(와이어프레임 '탭하면 재생'). 영상이 없으면 유튜브 검색으로 가는 회색 칸.
const videoThumb = (v, fallbackHref, label = "") => v && ytIdOf(v)
  ? `<a class="vth" href="${esc(v.url)}" target="_blank" rel="noopener" title="${esc(v.title)}"><img src="https://i.ytimg.com/vi/${esc(ytIdOf(v))}/mqdefault.jpg" alt="${esc(label)} 영상" loading="lazy"><span class="play">▶ ${esc(v.channel)}${v.official ? " · 공식" : ""}${v.views ? ` · ${views(v.views)}` : ""}</span></a>`
  : `<a class="vth none" href="${esc(fallbackHref)}" target="_blank" rel="noopener">▶ 영상 찾아보기</a>`;
const videoRow = v => ytIdOf(v) ? `<a class="vrow" href="${esc(v.url)}" target="_blank" rel="noopener"><img src="https://i.ytimg.com/vi/${esc(ytIdOf(v))}/mqdefault.jpg" alt="" loading="lazy"><span>▶ ${esc(v.title.length > 44 ? v.title.slice(0, 44) + "…" : v.title)}<br><span class="muted tiny">${esc(v.channel)}${v.official ? " · 공식" : ""}${v.views ? ` · 조회 ${views(v.views)}` : ""}</span></span></a>` : videoLink(v, "small");
const priceStrip = (w, grade) => w?.prices?.length ? `<div class="chips">${w.prices.map(([g, p]) => `<span class="tag ${g === grade ? "hit" : ""}">${esc(g)} ${won(p)}</span>`).join("")}</div>` : "";
const castChips = (work, cast, hitActors = []) => leads(work, cast).map(([r, a]) => `<span class="tag ${hitActors.includes(a) ? "rc" : ""}" style="--rc:${roleColor(work, r)}">${esc(r)} ${esc(a)}</span>`).join(" ");

// ---------- 화면 ----------
const V = {};

V.onboard = () => {
  const p = S.prefs || {axes: [], favs: []};
  const actors = [...new Set(Object.values(D.roles).flat().flatMap(r => r.cast))].sort();
  const group = (title, opts, kind = "axis", sub = "") => `<div class="card"><h3>${title}${sub ? ` <span class="small muted">${sub}</span>` : ""}</h3><div class="chips">${opts.map(o => `<button class="chip ${(kind === "grade" ? p.grade === o.v : p.axes.includes(o.v)) ? "on" : ""}" data-axis="${esc(o.v)}" data-kind="${kind}" data-group="${esc(title)}">${esc(o.l)}</button>`).join("")}</div></div>`;
  return `
    <h1>기본 취향 <span class="small muted">선택</span></h1>
    <p class="muted">작품마다 중요한 게 달라서, 취향은 비교 화면에서 작품별로 골라요. 여기 고른 건 새 작품을 열 때 기본값으로만 쓰여요. 좋아하는 배우·좌석 등급만 넣어 둬도 충분해요.</p>
    <div class="cards2">
    ${D.axes.map(a => group(a.title, [{v: a.left, l: a.l}, {v: a.right, l: a.r}])).join("")}
    ${group("주로 어느 좌석 등급을 봐요?", [{v: "VIP석", l: "VIP석"}, {v: "R석", l: "R석"}, {v: "S석", l: "S석"}, {v: "A석", l: "A석"}], "grade", "가격표에서 이 등급을 먼저 보여 줘요")}
    <div class="card"><h3>좋아하는 배우가 있다면 <span class="small muted">여러 명 가능</span></h3>

  S.cal[work].count = matched.length; S.cal[work].lo = lo; S.cal[work].hi = hi; save();
  const pins = pinsByRole(work, st.actors), avoid = st.avoid || [], pinOn = Object.keys(pins).length > 0, filtering = pinOn || avoid.length > 0;  // 비교 화면에서 고른 배우가 있으면 그 날만 진하게, 제외한 배우만 나오는 날은 흐리게
  const peek = st.peek && byDate[st.peek] ? st.peek : st.dates[st.dates.length - 1];
  const firstRole = leadRoles(work)[0]?.role;
  const [d0, d1] = dateRange(work, run);
  const months = []; for (let m = d0.slice(0, 7); m <= d1.slice(0, 7) && months.length < 12; m = firstOfNextMonth(m + "-01").slice(0, 7)) months.push(m);
  const monthHtml = m => {
    const first = new Date(m + "-01T00:00:00"), pad = (first.getDay() + 6) % 7, days = new Date(first.getFullYear(), first.getMonth() + 1, 0).getDate();
    let cells = "";
    for (let i = 0; i < pad; i++) cells += `<div class="day empty"></div>`;
    for (let d = 1; d <= days; d++) {
      const date = `${m}-${String(d).padStart(2, "0")}`, shows = (byDate[date] || []).sort((a, b) => a.time.localeCompare(b.time));
      if (!shows.length) { cells += `<div class="day none"><span class="n">${d}</span></div>`; continue; }
      const past = date < today(), hits = shows.filter(p => passes(p, pins, avoid));
      const cls = ["day", "has", pinOn ? (hits.length ? "hit" : "dim") : filtering && !hits.length ? "dim" : "", st.dates.includes(date) ? "pin" : "", date === peek ? "peek" : "", past ? "dim" : ""].join(" ");
      const lines = shows.map(p => `<span class="s ${filtering && !passes(p, pins, avoid) ? "m" : ""}" title="${esc(p.time)}">${esc(p.cast[firstRole] || "")}</span>`).join("");
      const star = shows.some(p => p.notes.some(n => /첫공|막공|폐막/.test(n))) ? `<span class="star">★</span>` : "";
      cells += `<div class="${cls}" data-act="${past ? "peek" : "pinDate"}" data-work="${esc(work)}" data-d="${date}"><span class="n">${d}</span>${lines}${star}</div>`;
    }

  const peekBar = peek

        ${peekShows.map(p => `<div class="row small"><b>${esc(p.time)}</b>${castChips(work, p.cast, st.actors)}<a class="tiny" href="#detail/${esc(work)}/${p.date}/${p.time}">자세히</a>${p.notes.length ? `<span class="tiny muted">${esc(p.notes.join(" · "))}</span>` : ""}</div>`).join("")}</div>`

  const ctaMain = st.dates.length

  const ctaSub = st.dates.length ? `<button class="btn ghost" data-act="runAll" data-work="${esc(work)}">날짜 상관없이 전체 보기</button>` : "";
  return `

// 누구? — 비교 화면. 질문 하나: "이 날(들)엔 누구 조합으로 볼까?" 한 컬럼: 요약 한 줄 → 취향 칩 → 카드.
// 갈 수 있는 날이 1~3개면 회차별 조합 카드, 아니면 배역별 비교 카드(+ 맨 아래 '이 조합으로 볼 수 있는 날'). 순위·점수는 매기지 않는다.
V.result = (workArg, mode = "", runs = [], pickRun = null) => {
  let q = S.query;
  if (mode !== "pick" && workArg && workOf(workArg)?.hasSchedule && (!q || q.work !== workArg)) {  // #result/작품 으로 바로 들어와도 동작
    const runs = runsOf(workArg), run = runs.find(r => r.hasSchedule) || runs[0];
    const st = (S.cal[workArg] ||= {actors: (S.prefs?.favs || []).filter(a => (D.roles[workArg] || []).some(r => r.cast.includes(a))), period: "all", run: run.label});
    const [lo0, hi0] = dateRange(workArg, run) || [today(), today()];
    q = S.query = {work: workArg, lo: mx(today(), lo0), hi: hi0, actors: st.actors, dates: st.dates || []}; save();
  }
  if (!q) return V.works();
  const work = q.work;
  const st = (S.cal[work] ||= {actors: [], period: "all"});
  if (!st.axes) st.axes = [...(S.prefs?.axes || [])];  // 취향은 작품마다 따로. 처음엔 기본 취향이 있으면 복사
  const prefs = st.axes, want = wantSet(prefs);
  const run = runOf(work, q.lo);
  const dates = [...(q.dates || [])].sort(), dateMode = dates.length >= 1 && dates.length <= 3;
  const all = D.perfs.filter(p => p.work === work && p.date >= q.lo && p.date <= q.hi && (dates.length < 4 || dates.includes(p.date))).sort((a, b) => (a.date + a.time).localeCompare(b.date + b.time));
  const avoid = (st.avoid ||= []);
  const pins = pinsByRole(work, st.actors), matched = all.filter(p => passes(p, pins, avoid));
  RES = dateMode ? null : {n: matched.length, sel: st.actors.length + avoid.length};  // 폰 하단 버튼용 요약. 날짜 모드엔 카드가 곧 답이라 없음
  const countWith = actors => { const pn = pinsByRole(work, actors); return all.filter(p => passes(p, pn, avoid)).length; };
  const avoidBtn = (a, label = "🚫 제외") => `<button class="chip x avoid" data-act="toggleAvoid" data-work="${esc(work)}" data-a="${esc(a)}">${label}</button>`;
  const scheduled = new Set(all.flatMap(p => Object.keys(p.cast)));
  const rolesHere = (D.roles[work] || []).filter(r => scheduled.has(r.role));
  const votes = S.votes.filter(v => v.work === work);
  const mine = (role, a) => votes.filter(v => v.role === role && (v.a === a || v.b === a));
  const net = (role, a) => mine(role, a).reduce((n, v) => n + (v.result === "tie" ? 0 : (v.result === "a") === (v.a === a) ? 1 : -1), 0);
  const tagsOf = a => (D.actorTags[work] || {})[a] || [];
  const dowOf = d => "일월화수목금토"[new Date(d + "T00:00:00").getDay()];
  const star = p => p.notes.some(n => /첫공|막공|폐막/.test(n)) ? " ★" : "";

  // 배역별 비교 카드: 후보를 같은 크기로 나란히. 정보 없는 배우도 '아직 정보 없음'으로 똑같이 보여 준다.
  const cand = (r, a) => {
    const rows = tagsOf(a), tags = [...new Set(rows.map(x => x.tag))], vid = videoOf(work, a);
    const hits = tags.filter(t => want.has(t)), quote = rows.find(x => want.has(x.tag)) || rows[0];
    const ex = avoid.includes(a), on = !ex && st.actors.includes(a), n = ex ? 0 : on ? matched.length : countWith([...st.actors, a]), off = !on && !ex && n === 0, v = net(r.role, a), nv = mine(r.role, a).length;
    return `<div class="cand ${on ? "on" : ""} ${off ? "off" : ""} ${ex ? "ex" : ""}" ${off ? "" : `data-act="${ex ? "toggleAvoid" : "toggleActor"}" data-work="${esc(work)}" data-a="${esc(a)}"`}>
      <div class="nm"><b>${esc(a)}</b><span class="cnt ${off || ex ? "off" : ""}">${ex ? "제외함" : on ? "선택됨" : off ? "같이 나오는 날 없음" : `${n}회`}</span></div>
      ${videoThumb(vid, `https://www.youtube.com/results?search_query=${encodeURIComponent(`뮤지컬 ${work} ${a} ${r.role}`)}`, a)}
      ${nv ? `<div class="vote">${v > 0 ? "내가 더 좋았던 쪽" : v < 0 ? "내가 덜 좋았던 쪽" : "내 평가 비슷"} · 비교 ${nv}건</div>` : ""}
      ${tags.length ? `<div class="chips">${[...hits, ...tags.filter(t => !hits.includes(t))].slice(0, 4).map(t => `<span class="tag ${want.has(t) ? "hit" : ""}">${esc(t)}</span>`).join("")}</div>` : `<div class="nodata">아직 정보 없음</div>`}
      ${quote ? `<div class="q"><span class="qm">❝</span>${esc(quote.why)} <span class="muted">— ${esc(srcLabel(quote))}</span>${quote.link ? ` <a href="${esc(quote.link)}" target="_blank" rel="noopener">출처</a>` : ""}</div>` : ""}
      <div class="cbtns">${ex ? `<span></span>` : `<button class="btn sm ${on ? "" : "ghost"} star" data-act="toggleActor" data-work="${esc(work)}" data-a="${esc(a)}" ${off ? "disabled" : ""}>${on ? "✓ 선택 완료" : "☆ 꼭 볼래요"}</button>`}${avoidBtn(a, ex ? "제외 풀기" : "제외")}</div>
    </div>`;
  };
  const order = (r, as) => as.map(a => ({a, v: net(r.role, a), h: [...new Set(tagsOf(a).map(x => x.tag))].filter(t => want.has(t)).length, k: tagsOf(a).length}))
    .sort((x, y) => y.v - x.v || y.h - x.h || y.k - x.k || x.a.localeCompare(y.a)).map(o => o.a);  // 내 비교 투표 → 취향 일치 → 태그 수 → 이름
  const roleBlock = r => { const here = r.cast.filter(a => all.some(p => p.cast[r.role] === a)); return here.length ? `<div class="card"><h3>${esc(r.role)} <span class="small muted">${esc(r.weight)} · ${here.length}명</span></h3><div class="cands">${order(r, here).map(a => cand(r, a)).join("")}</div></div>` : ""; };
  const leadsHere = rolesHere.filter(r => r.weight === "주연"), supsHere = rolesHere.filter(r => r.weight !== "주연");
  const drops = st.actors.map(a => ({a, n: countWith(st.actors.filter(x => x !== a))})).filter(o => o.n > 0).sort((x, y) => y.n - x.n);
  const frees = avoid.map(a => ({a, n: all.filter(p => passes(p, pins, avoid.filter(x => x !== a))).length})).filter(o => o.n > matched.length).sort((x, y) => y.n - x.n);  // 제외를 풀면 늘어나는 회차
  const avoidChips = avoid.length ? `<div class="chips"><span class="small muted">제외한 배우</span>${avoid.map(a => avoidBtn(a, `🚫 ${esc(a)} ✕`)).join("")}</div>` : "";

  // 회차별 조합 카드(날짜 모드): 그날 회차마다 카드 하나, 배우는 썸네일·태그·인용으로만.
  const ytId = v => (v?.url || "").match(/[?&]v=([\w-]+)/)?.[1];
  const perfs = dateMode ? perfsOf(work).filter(p => dates.includes(p.date)).sort((a, b) => (a.date + a.time).localeCompare(b.date + b.time)) : [];
  const leadCol = (r, a) => {
    const rows = tagsOf(a), tags = [...new Set(rows.map(x => x.tag))], vid = videoOf(work, a), id = ytId(vid), quote = rows.find(x => want.has(x.tag)) || rows[0];
    const shown = [...tags.filter(t => want.has(t)), ...tags.filter(t => !want.has(t))].slice(0, 2);
    const th = id ? `<a class="th" href="${esc(vid.url)}" target="_blank" rel="noopener"><img src="https://i.ytimg.com/vi/${esc(id)}/mqdefault.jpg" alt="${esc(a)} 영상" loading="lazy"></a>` : `<div class="th">영상 없음</div>`;
    return `<div class="pa">${th}<div class="nm"><b>${esc(a)}</b><span class="tiny muted">${esc(r)}</span></div>
      ${shown.length ? `<div class="chips">${shown.map(t => `<span class="tag ${want.has(t) ? "hit" : ""}">${esc(t)}</span>`).join("")}</div>` : `<div class="nodata">아직 정보 없음</div>`}
      ${quote ? `<div class="q"><span class="qm">❝</span><span class="clamp" title="${esc(quote.why)}">${esc(quote.why)}</span> — ${esc(srcLabel(quote))}${quote.link ? ` <a href="${esc(quote.link)}" target="_blank" rel="noopener">출처</a>` : ""}</div>` : ""}
      ${avoidBtn(a)}</div>`;
  };
  const shownPerfs = perfs.filter(p => passes(p, {}, avoid)), cut = perfs.length - shownPerfs.length;
  const perfCard = p => {
    const planned = S.plans.some(x => x.work === work && x.date === p.date && x.time === p.time), sup = rests(work, p.cast);
    return `<div class="card perf">${whenTile(p)}
      <div class="leads">${leads(work, p.cast).map(([r, a]) => leadCol(r, a)).join("")}</div>
      ${sup.length ? `<div class="rest">조연 ${sup.map(([r, a]) => `${esc(r)} ${esc(a)}`).join(" · ")}</div>` : ""}
      <div class="acts"><button class="btn ghost" data-go="#detail/${esc(work)}/${p.date}/${p.time}">이 회차 상세</button>
        <button class="btn" data-act="plan" data-work="${esc(work)}" data-date="${p.date}" data-time="${p.time}" ${planned ? "disabled" : ""}>${planned ? "볼 예정에 담겼어요" : "볼 예정에 담기"}</button></div></div>`;
  };

  // 배역별 모드의 마지막 카드: 고른 배우 조합으로 볼 수 있는 날. 폰 하단 버튼(toSide)이 여기로 스크롤한다.
  const datesCard = `<div class="side"><div class="card accent" id="combo-dates"><div class="between"><h3>${st.actors.length ? "이 조합으로 볼 수 있는 날" : avoid.length ? "제외하고 볼 수 있는 날" : "볼 수 있는 날"} <span class="small muted">회차 ${matched.length}개</span></h3>${st.actors.length ? `<button class="chip x" data-act="clearActors" data-work="${esc(work)}">선택 해제</button>` : ""}</div>
      ${st.actors.length ? `<div class="chips">${st.actors.map(a => `<span class="tag hit">${esc(a)}</span>`).join("")}</div>` : avoid.length ? "" : `<p class="small muted">위에서 배역마다 보고 싶은 배우를 고르면 그 조합이 나오는 날만 남아요.</p>`}
      ${avoidChips}
      ${matched.length ? `<div class="chips">${matched.slice(0, 14).map(p => `<button class="chip" data-go="#detail/${esc(work)}/${p.date}/${p.time}">${md(p.date)}(${esc(p.dow)}) ${esc(p.time)}${star(p)}</button>`).join("")}${matched.length > 14 ? `<span class="tiny muted">외 ${matched.length - 14}개</span>` : ""}</div>`
        : `<div class="nodata">${st.actors.length ? "이 조합으로 같이 나오는 날이 없어요." : "제외한 배우가 모든 회차에 나와요."}</div><div class="chips">${drops.map(o => `<button class="chip" data-act="dropActor" data-work="${esc(work)}" data-a="${esc(o.a)}">${esc(o.a)} 빼기<span class="n">${o.n}회</span></button>`).join("")}${frees.map(o => `<button class="chip" data-act="toggleAvoid" data-work="${esc(work)}" data-a="${esc(o.a)}">${esc(o.a)} 제외 풀기<span class="n">${o.n}회</span></button>`).join("")}</div>`}
      <p class="tiny muted">날짜를 누르면 그 회차의 전체 캐스트 · 가격 · 예매 링크가 나와요.</p></div></div>`;

  const when = dates.length ? dates.map(d => `${md(d)}(${dowOf(d)})`).join(", ") : `${md(q.lo)} ~ ${md(q.hi)} 전체`;
  const tasteCard = `<div class="card" style="padding:12px 16px"><div class="between"><h3>이 작품에서 중요한 것 <span class="small muted">안 골라도 돼요</span></h3>${prefs.length ? `<button class="chip x" data-act="rAxis" data-work="${esc(work)}" data-v="">지우기</button>` : ""}</div>
        <div class="chips">${D.axes.map(a => `<span class="pair">${[[a.left, a.l], [a.right, a.r]].map(([v, l]) => `<button class="chip ${prefs.includes(v) ? "on" : ""}" data-act="rAxis" data-work="${esc(work)}" data-v="${esc(v)}">${esc(l)}</button>`).join("")}</span>`).join("")}</div>
        <p class="tiny muted">진한 태그가 여기서 고른 것과 맞는 리뷰예요. 고르면 다음 화면에서 근거가 많은 조합에 PICK이 붙어요.</p></div>`;
  if (mode === "pick") {  // 누구? — 꼭 볼 배우·뺄 배우를 고르고 '언제' 화면으로
    RES = {n: matched.length, go: `#when/${work}`};
    const runChips = runs.length > 1 ? `<div class="chips">${runs.map(r => `<button class="chip ${r.label === pickRun?.label ? "on" : ""}" data-act="run" data-r="${esc(r.label)}">${esc(r.label)}<small>${esc(r.venue)} · ${fmtPeriod(r)}</small></button>`).join("")}</div>` : "";
    const summary = `<div class="card accent" id="combo-dates"><h3>고른 조건 <span class="small muted">회차 ${matched.length}개</span></h3>
      ${st.actors.length || avoid.length ? `<div class="chips">${st.actors.map(a => `<button class="chip x on" data-act="toggleActor" data-work="${esc(work)}" data-a="${esc(a)}">⭐ ${esc(a)} ✕</button>`).join("")}${avoid.map(a => avoidBtn(a, `🚫 ${esc(a)} ✕`)).join("")}</div>` : `<p class="small muted">배역마다 꼭 볼 배우(⭐)나 뺄 배우(🚫)를 골라 주세요. 안 골라도 돼요.</p>`}
      ${matched.length ? `<div class="inline-cta"><button class="btn" data-go="#when/${esc(work)}">조건에 맞는 회차 ${matched.length}개 보기 →</button></div>`
        : `<div class="nodata">${st.actors.length ? "이 조합으로 같이 나오는 날이 없어요." : "제외한 배우가 모든 회차에 나와요."}</div><div class="chips">${drops.map(o => `<button class="chip" data-act="dropActor" data-work="${esc(work)}" data-a="${esc(o.a)}">${esc(o.a)} 빼기<span class="n">${o.n}회</span></button>`).join("")}${frees.map(o => `<button class="chip" data-act="toggleAvoid" data-work="${esc(work)}" data-a="${esc(o.a)}">${esc(o.a)} 제외 풀기<span class="n">${o.n}회</span></button>`).join("")}</div>`}</div>`;
    return `
    <div class="one wide">
      <div class="head sm">${posterEl(workOf(work))}<div><p class="eyebrow">누구로 볼까요?</p><h1>${esc(work)}</h1>
        <p class="small muted">${pickRun ? esc(pickRun.venue) + " · " + fmtPeriod(pickRun) : ""}</p></div></div>
      ${runChips}
      <div class="pickgrid">
        <aside class="pside">${tasteCard}${summary}</aside>
        <div class="pmain">
          ${all.length === 0 ? `<div class="card">남은 회차가 없어요.</div>` : `<p class="small muted">배역마다 꼭 볼 배우는 ⭐, 보기 싫은 배우는 🚫를 눌러요. 숫자는 그 배우를 더하면 남는 회차 수예요. 배우를 우열로 평가하지 않고 특성 차이로 보여드려요.</p>`}
          ${leadsHere.map(roleBlock).join("")}
          ${supsHere.length ? `<details class="card"><summary>조연도 비교하기</summary><div style="display:grid;gap:12px;margin-top:8px">${supsHere.map(roleBlock).join("")}</div></details>` : ""}
        </div>
      </div>
      <p class="tiny muted">스케줄은 변경될 수 있어요 · 공식 캐스팅 스케줄 기준 · '정보 없음'은 데이터가 없는 거지 취향과 안 맞는다는 뜻이 아니에요.</p>
    </div>`;
  }
  return `
    <div class="one">
      <div class="head sm">${posterEl(workOf(work))}<div><h1>${esc(work)}</h1>
        <p class="small muted">${run ? esc(run.label) + " · " + esc(run.venue) + " · " : ""}${esc(when)} · <a href="#cal/${esc(work)}">날짜 바꾸기</a></p></div></div>
      ${dates.length ? `<div class="chips">${dates.map(d => `<button class="chip x on" data-act="unpinDate" data-work="${esc(work)}" data-d="${d}">${md(d)}(${dowOf(d)}) ✕</button>`).join("")}<button class="chip x" data-act="clearDates" data-work="${esc(work)}">날짜 상관없이 보기</button></div>` : ""}
      ${run?.prices?.length ? `<div class="row small muted">${priceStrip(run, S.prefs?.grade)}<span class="tiny">정가 · 할인 전</span></div>` : ""}
      ${tasteCard}
      ${dateMode
        ? (perfs.length ? `<p class="small muted">회차마다 그날 나오는 배우예요. 배우를 우열로 평가하지 않고, 특성 차이로 보여드려요. 🚫 제외를 누르면 그 배우가 나오는 회차는 빠져요.</p>${avoidChips}${cut ? `<p class="tiny muted">제외한 배우가 나와서 ${cut}개 회차를 뺐어요.</p>` : ""}${shownPerfs.map(perfCard).join("") || `<div class="card">고른 날의 회차에 모두 제외한 배우가 나와요. 위에서 제외를 풀거나 <a href="#cal/${esc(work)}">날짜를 바꿔</a> 보세요.</div>`}` : `<div class="card">고른 날짜에 공연이 없어요. <a href="#cal/${esc(work)}">날짜 바꾸기</a></div>`)
        : `${all.length === 0 ? `<div class="card">이 기간에 회차가 없어요. <a href="#cal/${esc(work)}">날짜 바꾸기</a></div>` : `<p class="small muted">배역마다 보고 싶은 배우를 고르면 그 조합이 나오는 날만 아래에 남아요. 보기 싫은 배우는 🚫 제외를 누르면 그 배우가 나오는 회차가 빠져요.</p>`}
      ${leadsHere.map(roleBlock).join("")}
      ${supsHere.length ? `<details class="card"><summary>조연도 비교하기</summary><div style="display:grid;gap:12px;margin-top:8px">${supsHere.map(roleBlock).join("")}</div></details>` : ""}
      ${datesCard}`}
      <p class="tiny muted">스케줄은 변경될 수 있어요 · 공식 캐스팅 스케줄 기준 · '정보 없음'은 데이터가 없는 거지 취향과 안 맞는다는 뜻이 아니에요.</p>
    </div>`;
};

// 이미 본 조합: '본 공연'(지난 날짜이거나 관람 후 기록을 남긴 회차)의 주연 조합. 조연은 세지 않는다
const leadKey = (work, cast) => leads(work, cast).map(([r, a]) => r + ":" + a).sort().join("|");
const isSeen = x => x.tagged || x.date < today();
const seenKeys = work => new Set(S.plans.filter(x => x.work === work && isSeen(x)).map(x => leadKey(work, x.cast)));

// 누구? — 작품을 고르면 여기부터. 고른 공연(서울·대구 등) 전체 기간에서 꼭 볼 배우·뺄 배우를 고른다
V.pick = work => {
  const w = workOf(work); if (!w?.hasSchedule) return V.works();
  const runs = runsOf(work).filter(r => r.hasSchedule).concat(runsOf(work).some(r => r.hasSchedule) ? [] : w.runs.filter(r => r.hasSchedule));
  const st = (S.cal[work] ||= {actors: (S.prefs?.favs || []).filter(a => (D.roles[work] || []).some(r => r.cast.includes(a))), period: "all", run: runs[0]?.label});
  const run = runs.find(r => r.label === st.run) || runs[0];
  const [lo0, hi0] = dateRange(work, run) || [today(), today()];
  S.query = {work, lo: mx(today(), lo0), hi: hi0, actors: st.actors, dates: []}; save();
  return V.result(work, "pick", runs, run);
};

// 언제? — 조건에 맞는 회차를 '남은 주연 배역 조합'별로 묶고, 고른 취향과 맞는 근거가 많은 조합에 PICK
const WHEN_F = [["weekend", "주말만"], ["month", "이번 달"], ["day", "낮 공연"], ["eve", "저녁 공연"]];
V.when = (work, flag = "") => {
  const w = workOf(work); if (!w?.hasSchedule) return V.works();
  const runs = runsOf(work).filter(r => r.hasSchedule).concat(runsOf(work).some(r => r.hasSchedule) ? [] : w.runs.filter(r => r.hasSchedule));
  const st = (S.cal[work] ||= {actors: [], period: "all", run: runs[0]?.label});
  const run = runs.find(r => r.label === st.run) || runs[0];
  const f = (st.f ||= {}), avoid = st.avoid || [], pins = pinsByRole(work, st.actors);
  const prefs = st.axes || [], want = wantSet(prefs), seen = seenKeys(work), unseenOnly = flag === "unseen";
  const t = today(), month = t.slice(0, 7);
  const ok = p => (!f.weekend || ["토", "일"].includes(p.dow)) && (!f.month || p.date.startsWith(month)) && (!f.day || p.time < "17:00") && (!f.eve || p.time >= "17:00");
  const base = perfsOf(work, run).filter(p => p.date >= t && passes(p, pins, avoid));
  const list = base.filter(ok).sort((a, b) => (a.date + a.time).localeCompare(b.date + b.time));
  const tagsOf = a => (D.actorTags[work] || {})[a] || [];
  const groups = new Map();
  for (const p of list) {
    const rem = leads(work, p.cast).filter(([r]) => !pins[r]);
    const k = rem.map(([r, a]) => r + ":" + a).join("|");
    const g = groups.get(k) || {rem, perfs: [], key: k};
    g.perfs.push(p); groups.set(k, g);
  }
  for (const g of groups.values()) {
    const ev = [];
    for (const [r, a] of g.rem) for (const x of tagsOf(a)) if (want.has(x.tag)) ev.push({who: a, role: r, ...x});
    const names = [...new Set(g.perfs.flatMap(p => leads(work, p.cast).map(([, a]) => a)))];
    for (const c of (D.comboTags[work] || [])) if (names.includes(c.a) && names.includes(c.b) && want.has(c.tag) && g.rem.some(([, a]) => a === c.a || a === c.b)) ev.push({who: `${c.a}×${c.b}`, role: "조합", ...c});
    // 점수 = (배우, 고른 취향) 쌍의 수. 한 배우가 같은 취향 태그를 리뷰 여러 곳에서 받아도 1점 — 태그 수는 실력이 아니라 리뷰 양이라서
    g.hit = new Set(ev.flatMap(e => prefs.filter(p => (D.axis[p] || [p]).includes(e.tag)).map(p => e.who + "|" + p))).size;
    // 고른 취향의 반대쪽 태그(맑은 음색을 골랐는데 허스키). 감점이 아니라 동점일 때 순서와 표시에만 쓴다. 가창↔연기는 반대가 아니라서 뺀다
    const opp = prefs.flatMap(p => D.axes.filter(x => x.left !== "가창").flatMap(x => x.left === p ? [x.right] : x.right === p ? [x.left] : []));
    const oppTags = new Set(opp.flatMap(q => D.axis[q] || []).filter(t => !want.has(t)));
    g.bad = g.rem.flatMap(([r, a]) => tagsOf(a).filter(x => oppTags.has(x.tag)).map(x => ({who: a, role: r, ...x})));
    g.ev = ev; g.seen = g.perfs.every(p => seen.has(leadKey(work, p.cast)));
  }
  let gs = [...groups.values()].filter(g => !unseenOnly || !g.seen);
  const order = (a, b) => b.hit - a.hit || a.bad.length - b.bad.length || b.perfs.length - a.perfs.length;
  const ranked = [...gs].filter(g => g.hit && !g.seen).sort(order);
  const pick = new Set(ranked.slice(0, 2));  // 근거가 0이면 PICK을 찍지 않는다. 이미 본 조합은 PICK에서 빼고 새 조합을 먼저 권한다
  gs.sort((a, b) => (pick.has(b) - pick.has(a)) || (a.seen - b.seen) || order(a, b));
  const axisLabel = v => D.axes.flatMap(a => [[a.left, a.l], [a.right, a.r]]).find(([k]) => k === v)?.[1] || v;
  const prefText = prefs.map(axisLabel).join(" · ");
  const label = g => g.rem.length ? g.rem.map(([r, a]) => `<span class="muted small">${esc(r)}</span> <b>${esc(a)}</b>`).join(" · ") : "고른 캐스트 그대로";
  const kind = p => `${["토", "일"].includes(p.dow) ? "주말" : "평일"} ${p.time < "17:00" ? "낮공" : "밤공"}`;
  const tile = p => { const s2 = seen.has(leadKey(work, p.cast)), sp = p.notes.filter(n => /첫공|막공|폐막/.test(n));
    return `<a class="tile ${s2 ? "seen" : ""}" href="#detail/${esc(work)}/${p.date}/${p.time}">
      <div class="between"><span class="lab ${sp.length ? "sp" : ""}">${sp.length ? `★ ${esc(sp[0].length > 12 ? sp[0].slice(0, 11) + "…" : sp[0])}` : kind(p)}</span><span class="tm">${esc(p.time)}</span></div>
      <div class="dt">${md(p.date)} (${esc(p.dow)})</div>
      <div class="meta">${s2 ? "이미 본 조합" : esc(run.venue)}</div>
      <span class="go">${s2 ? "다시 보기" : "회차 상세 보기"}</span></a>`; };
  const why = (g, strong) => `<details class="whybox ${strong ? "" : "plain"}"><summary><span>✦ ${esc(prefText)} — 맞는 배우 ${new Set(g.ev.map(e => e.who)).size}명 · 근거 ${g.ev.length}건</span><span class="pill">근거 보기</span></summary>${evidenceList(g.ev)}</details>`;
  const badText = g => { const m = {}; for (const e of g.bad) (m[e.who] ||= new Set()).add(e.tag); return Object.entries(m).map(([a, ts]) => `${a} ${[...ts].join("·")}`).join(", "); };
  const badBox = g => g.bad.length ? `<details class="whybox plain"><summary><span>△ 고른 취향과 반대: ${esc(badText(g))}</span><span class="pill">근거 보기</span></summary>${evidenceList(g.bad)}</details>` : "";
  const card = g => `<div class="card grp ${pick.has(g) ? "picked" : ""} ${g.seen ? "seen" : ""}">
      <div class="between"><h3>${pick.has(g) ? `<span class="pickb">PICK</span> ` : ""}${label(g)}</h3><span class="cntp">${g.perfs.length}회차</span></div>
      ${pick.has(g) ? why(g, true) : g.seen ? `<p class="small muted">이미 본 조합이에요${g.ev.length ? ` · 근거 ${g.ev.length}건` : ""}</p>` : g.ev.length ? why(g, false) : want.size ? `<p class="small muted">고른 취향과 맞는 근거가 아직 없어요 · 영상으로 확인해 보세요</p>` : ""}
      ${g.seen ? "" : badBox(g)}
      <div class="tiles">${g.perfs.slice(0, 12).map(tile).join("")}</div>${g.perfs.length > 12 ? `<p class="tiny muted">외 ${g.perfs.length - 12}회</p>` : ""}</div>`;
  const shown = gs.slice(0, 8), more = gs.slice(8);
  const cond = `<div class="chips">${st.actors.map(a => `<span class="tag hit">⭐ ${esc(a)}</span>`).join("")}${avoid.map(a => `<span class="tag">🚫 ${esc(a)}</span>`).join("")}${!st.actors.length && !avoid.length ? `<span class="tag">캐스트 조건 없음</span>` : ""}<a class="chip x" href="#pick/${esc(work)}">캐스팅 다시 고르기</a></div>`;
  const filters = `<div class="row"><div class="chips">${WHEN_F.map(([k, l]) => `<button class="chip x ${f[k] ? "on" : ""}" data-act="whenF" data-work="${esc(work)}" data-k="${k}">${l}</button>`).join("")}${unseenOnly ? `<a class="chip x on" href="#when/${esc(work)}">안 본 조합만 ✕</a>` : ""}</div><a class="chip x" href="#cal/${esc(work)}" style="margin-left:auto">달력으로 보기</a></div>`;
  const empty = base.length && !list.length ? `<div class="card"><p>필터에 맞는 회차가 없어요.</p><button class="btn ghost" data-act="whenClear" data-work="${esc(work)}">필터 풀기</button></div>`
    : !list.length ? `<div class="card"><p>조건에 맞는 회차가 없어요.</p><a class="btn ghost" href="#pick/${esc(work)}">캐스팅 다시 고르기</a></div>` : "";
  return `
    <div class="one">
      <div class="head sm">${posterEl(w)}<div><p class="eyebrow">언제 볼까요?</p><h1>${esc(work)}</h1><p class="small muted">${esc(run.venue)} · ${fmtPeriod(run)}</p></div></div>
      ${cond}
      ${filters}

const MOODS = {good: "좋았어요", meh: "그저 그랬어요", bad: "아쉬웠어요"};

// 캘린더 파일(.ics)을 의존성 없이 data: URL로 만든다. DTSTART는 시간대 없는 로컬 시각이라 보는 사람 기기의 시간대로 들어간다. 길이는 2시간 30분으로 고정.
// ponytail: 공연마다 러닝타임이 다르다. 데이터에 러닝타임이 생기면 그 값으로
function icsHref(x, run) {
  const p2 = n => String(n).padStart(2, "0");
  const loc = d => fmt(d).replace(/-/g, "") + "T" + p2(d.getHours()) + p2(d.getMinutes()) + "00";
  const start = new Date(`${x.date}T${x.time}:00`), end = new Date(start.getTime() + 150 * 60000), u = new Date();
  const stamp = `${u.getUTCFullYear()}${p2(u.getUTCMonth() + 1)}${p2(u.getUTCDate())}T${p2(u.getUTCHours())}${p2(u.getUTCMinutes())}${p2(u.getUTCSeconds())}Z`;
  const e = s => String(s).replace(/[\\;,]/g, "\\$&").replace(/\r?\n/g, "\\n");
  const who = leads(x.work, x.cast).map(([, a]) => a).join("·");
  const ics = ["BEGIN:VCALENDAR", "VERSION:2.0", "PRODID:-//PICKLE//KO", "CALSCALE:GREGORIAN", "BEGIN:VEVENT",
    `UID:pickle-${x.date}-${x.time.replace(":", "")}-${x.work.replace(/\s+/g, "")}@pickle`, `DTSTAMP:${stamp}`, `DTSTART:${loc(start)}`, `DTEND:${loc(end)}`,
    `SUMMARY:${e(who ? `${x.work} (${who})` : x.work)}`, ...(run?.venue ? [`LOCATION:${e(run.venue)}`] : []), "END:VEVENT", "END:VCALENDAR"].join("\r\n") + "\r\n";
  return "data:text/calendar;charset=utf-8," + encodeURIComponent(ics);
}

V.plans = () => {

      <button class="chip x" data-act="unplan" data-i="${i}">삭제</button></div>`;
  const items = S.plans.map((x, i) => [x, i]), up = items.filter(([x]) => !isSeen(x)), done = items.filter(([x]) => isSeen(x));
  const works = [...new Set(done.map(([x]) => x.work))];

  }).join("");

    : `${progress ? `<h2>내 캐스팅 아카이브</h2><div class="cards2">${progress}</div>` : ""}
  <div class="cards2">${done.map(([x, i]) => card(x, i)).join("") || `<div class="card"><p class="small muted">아직 본 공연이 없어요.</p></div>`}</div>`}`
  : `<div class="card"><p>아직 담은 공연이 없어요.</p><p class="small muted">회차 상세에서 '볼 예정에 담기'를 누르면 여기 모여요.</p><a class="btn" href="#works">추천 받으러 가기</a></div>`}`;

      <button class="btn ghost" data-go="#onboard">취향 다시 고르기</button></div>
    <div class="card"><h3>내가 남긴 관람 기록 ${S.tags.length}건${S.votes.length ? ` <span class="small muted">· 비교 투표 ${S.votes.length}건</span>` : ""}</h3>
      ${S.tags.length ? S.tags.map(t => `<div class="actor"><div class="name"><span><b>${esc(t.work)}</b>${esc(t.actor)}</span><span class="small muted">${md(t.date)} ${esc(t.time)}${t.score ? ` · 추천 ${t.score}점` : ""}${t.seat ? ` · ${esc(t.seat)}` : ""}${t.view ? ` · 시야 ${t.view}` : ""}</span></div><div class="chips">${t.mood ? `<span class="tag hit">${esc(MOODS[t.mood] || "")}</span>` : ""}${t.tags.map(g => `<span class="tag hit">${esc(g)}</span>`).join("")}${t.combo.map(g => `<span class="tag">${esc(g)} · ${esc(t.partner)}</span>`).join("")}</div></div>`).join("")
        : `<p class="small muted">공연을 보고 기록을 남기면 여기 쌓여요. 태그까지 남기면 다음 추천에 바로 반영돼요.</p>`}</div>
    ${rows.length ? `<div class="card"><h3>팀 시트로 내보내기</h3><p class="small muted">'태그 기록' 탭 맨 아래에 붙여 넣는 TSV ${rows.length}줄이에요.</p><button class="btn ghost" data-act="copyTsv">TSV 복사</button><pre>${esc(rows.map(r => r.join("\t")).join("\n"))}</pre></div>` : ""}
    </div>
    <p class="tiny muted">이 가안은 이 브라우저에만 저장돼요. 추천 규칙과 데이터는 팀 시트와 recommend.py에서 와요.</p>`;
};

function exportRows() {
  const out = [];
  for (const t of S.tags) {
    const venue = runOf(t.work, t.date)?.venue || "", show = `${md(t.date)} ${t.time}`;
    // 좌석·시야는 태그 기록 탭에 열이 없어서 메모 열에 같이 적는다. 좌석 탭이 생기면 분리한다.
    const note = [t.note, t.seat ? `좌석 ${t.seat}` : "", t.view ? `시야 ${t.view}/5` : ""].filter(Boolean).join(" · ");
    // 기분만 남겨도 행 1개는 나간다: 종류 '관람', 태그 열에 기분. 배우·배역은 '더 남기기'에서 골랐을 때만 채워진다
    if (t.mood || !t.tags.length) out.push([t.at, "앱", t.work, "2026", venue, show, "관람", t.role, t.actor, "", MOODS[t.mood] || "", note, "직접 관람", ""]);
    for (const tag of t.tags) out.push([t.at, "앱", t.work, "2026", venue, show, "배우", t.role, t.actor, "", tag, note, "직접 관람", ""]);
    if (t.partner) for (const tag of t.combo) out.push([t.at, "앱", t.work, "2026", venue, show, "조합", t.role, t.actor, t.partner, tag, note, "직접 관람", ""]);
  }
  // 같은 배역 비교 투표: 종류 '비교', 배우=내가 본 쪽, 상대 배우=비교 대상, 태그 열에 결과
  for (const v of S.votes) out.push([v.at, "앱", v.work, "2026", runOf(v.work, v.date)?.venue || "", `${md(v.date)} ${v.time}`, "비교", v.role, v.a, v.b, v.result === "a" ? "더 좋았다" : v.result === "b" ? "덜 좋았다" : "비슷", "같은 배역 비교 투표", "직접 관람", ""]);
  return out;
}

// ---------- 라우터 ----------
let CUR = {name: "", args: []}, lastHash, RES;  // RES: 결과 화면의 고른 조합 요약(폰의 하단 버튼용)
function route() {
  const h = decodeURIComponent(location.hash.slice(1) || "works");  // 첫 화면은 작품. 기본 취향(#onboard)은 선택
  const [name, ...args] = h.split("/");
  CUR = {name, args};
  closeSheet();
  RES = null;
  const view = $("#view"); view.innerHTML = (V[name] || V.works)(...args); view.dataset.view = V[name] ? name : "works";
  const stepIdx = {works: 0, pick: 1, result: 1, when: 2, cal: 2, detail: 3, saved: 3, tag: 4}[name];
  $("#steps").innerHTML = stepIdx === undefined ? "" : STEP_NAMES.map((s, i) => `<span class="${i === stepIdx ? "on" : ""}"><i>0${i + 1}</i>${s}</span>`).join('<b class="sep">→</b>');
  $("#back").hidden = ["works", "onboard", "plans", "me"].includes(name);
  const tab = {plans: "plans", tag: "plans", me: "me"}[name] || "home";
  document.querySelectorAll("[data-tab]").forEach(a => a.classList.toggle("on", a.dataset.tab === tab));
  const cta = $("#cta");
  if (name === "cal") { const st = S.cal[args[0]], nd = (st?.dates || []).length; cta.hidden = false;
    cta.innerHTML = nd ? `<button class="btn" data-act="runQuery" data-work="${esc(args[0])}" ${st.count ? "" : "disabled"}>${nd}일 골랐어요 → 그날 회차 비교 (회차 ${st.count}개)</button>` : `<button class="btn" data-act="runAll" data-work="${esc(args[0])}" ${st?.count ? "" : "disabled"}>목록으로 보기 →</button>`; }
  else if (name === "result" && RES?.go) { cta.hidden = false; cta.innerHTML = `<button class="btn" data-go="${esc(RES.go)}" ${RES.n ? "" : "disabled"}>${RES.n ? `조건에 맞는 회차 ${RES.n}개 보기 →` : "같이 나오는 날이 없어요"}</button>`; }
  else if (name === "pick" && RES?.go) { cta.hidden = false; cta.innerHTML = `<button class="btn" data-go="${esc(RES.go)}" ${RES.n ? "" : "disabled"}>${RES.n ? `조건에 맞는 회차 ${RES.n}개 보기 →` : "같이 나오는 날이 없어요"}</button>`; }
  else if (name === "result" && RES) { cta.hidden = false; cta.innerHTML = `<button class="btn" data-act="toSide">${RES.n ? `${RES.sel ? "고른 조합" : "전체"} 회차 ${RES.n}개 보기 ↓` : "같이 나오는 날이 없어요 ↓"}</button>`; }
  else cta.hidden = true;
  if (location.hash !== lastHash) window.scrollTo(0, 0);  // 화면이 바뀔 때만 맨 위로. 카드·칩을 눌러 다시 그릴 땐 스크롤을 유지한다
  lastHash = location.hash;
}
window.addEventListener("hashchange", route);
$("#back").addEventListener("click", () => history.back());
$("#sheetbg").addEventListener("click", closeSheet);

// ---------- 동작 ----------
document.addEventListener("click", e => {
  const go = e.target.closest("[data-go]");
  if (go) { location.hash = go.dataset.go; return; }
  const b = e.target.closest("[data-axis]");
  if (b) { const grp = b.dataset.group, on = b.classList.contains("on"); document.querySelectorAll(`[data-group="${CSS.escape(grp)}"]`).forEach(x => x.classList.remove("on")); if (!on) b.classList.add("on"); return; }
  if (e.target.closest("a[href]")) return;  // 카드 안의 출처·영상 링크는 카드 동작을 건드리지 않는다
  const act = e.target.closest("[data-act]"); if (!act) return;
  const d = act.dataset, draft = S.draft, work = CUR.args[0];
  const favsNow = () => [...document.querySelectorAll("#favs [data-a]")].map(x => x.dataset.a);
  switch (d.act) {
    case "addFav": { const v = $("#fav").value.trim(); if (!v) return; if (!favsNow().includes(v)) $("#favs").insertAdjacentHTML("beforeend", `<button class="chip x on" data-act="rmFav" data-a="${esc(v)}">${esc(v)} ×</button>`); $("#fav").value = ""; break; }
    case "rmFav": act.remove(); break;
    case "savePrefs": { const on = [...document.querySelectorAll("[data-axis].on")];
      S.prefs = {axes: on.filter(x => x.dataset.kind !== "grade").map(x => x.dataset.axis), grade: on.find(x => x.dataset.kind === "grade")?.dataset.axis || "", favs: favsNow()};
      S.cal = {}; save(); location.hash = "#works"; toast("취향을 저장했어요"); break; }
    case "skipPrefs": S.prefs = {axes: [], grade: "", favs: []}; save(); location.hash = "#works"; break;
    case "toggleActor": { const st = (S.cal[d.work || work] ||= {actors: [], period: "all"}); st.actors = st.actors.includes(d.a) ? st.actors.filter(a => a !== d.a) : [...st.actors, d.a]; save(); route(); break; }
    case "clearActors": S.cal[d.work || work].actors = []; save(); route(); break;
    case "toggleAvoid": {  // 제외는 보고 싶은 배우와 동시에 될 수 없다. 다시 누르면 풀림
      const st = (S.cal[d.work || work] ||= {actors: [], period: "all"}), av = st.avoid || [];
      st.avoid = av.includes(d.a) ? av.filter(a => a !== d.a) : [...av, d.a]; st.actors = st.actors.filter(a => a !== d.a);
      save(); route(); break; }
    case "period": S.cal[work].period = d.p; save(); route(); break;
    case "rAxis": {  // 작품별 취향 칩. 짝(노래↔연기 등)은 하나만
      const st = S.cal[d.work], P = Object.fromEntries(D.axes.flatMap(a => [[a.left, a.right], [a.right, a.left]]));  // 짝은 사전·설문 축 5쌍에서
      st.axes = !d.v ? [] : st.axes.includes(d.v) ? st.axes.filter(x => x !== d.v) : [...st.axes.filter(x => x !== P[d.v]), d.v];
      save(); route(); break; }
    case "run": S.cal[work].run = d.r; save(); route(); break;
    case "dropActor": { const w = d.work || work; S.cal[w].actors = S.cal[w].actors.filter(a => a !== d.a); save(); route(); break; }
    case "peek": { (S.cal[d.work || work] ||= {actors: [], period: "all"}).peek = d.d; save(); route(); break; }
    case "pinDate": { const st = (S.cal[d.work || work] ||= {actors: [], period: "all"}); st.dates = (st.dates || []).includes(d.d) ? st.dates.filter(x => x !== d.d) : [...(st.dates || []), d.d].sort(); st.peek = d.d; if (S.query?.work === (d.work || work)) S.query.dates = st.dates; save(); route(); break; }
    case "runAll": { const st = S.cal[d.work]; st.dates = []; save(); location.hash = "#when/" + d.work; break; }  // 달력에서 날짜를 안 고르면 '언제' 목록으로
    case "whenF": { const st = S.cal[d.work], f = (st.f ||= {}); f[d.k] = !f[d.k]; if (d.k === "day" && f.day) f.eve = false; if (d.k === "eve" && f.eve) f.day = false; save(); route(); break; }
    case "whenClear": S.cal[d.work].f = {}; save(); route(); break;
    case "unpinDate": { const st = S.cal[d.work || work]; st.dates = (st.dates || []).filter(x => x !== d.d); if (S.query?.work === (d.work || work)) S.query.dates = st.dates; save(); route(); break; }
    case "clearDates": { const st = S.cal[d.work || work]; st.dates = []; if (S.query?.work === (d.work || work)) S.query.dates = []; save(); route(); break; }
    case "toSide": $("#view .side").scrollIntoView(); break;
    case "closeSheet": closeSheet(); break;
    case "runQuery": { const st = S.cal[d.work]; if (!st?.count) { toast("조건에 맞는 회차가 없어요"); return; } S.query = {work: d.work, lo: st.lo, hi: st.hi, actors: st.actors, dates: st.dates || []}; save(); location.hash = "#result"; break; }
    case "plan": { const p = D.perfs.find(x => x.work === d.work && x.date === d.date && x.time === d.time); S.plans.push({work: p.work, date: p.date, dow: p.dow, time: p.time, cast: p.cast, tagged: false}); save(); location.hash = "#saved/" + (S.plans.length - 1); break; }
    case "unplan": S.plans.splice(+d.i, 1); save(); route(); break;
    case "plansTab": S.plansTab = d.t; save(); route(); break;
    case "tQuick": { const x = S.plans[+d.i]; x.quick = x.quick === d.q ? "" : d.q; save(); route(); break; }  // 저장 확인 화면의 좋아요/아쉬워요. 다시 누르면 해제
    case "tMood": draft.mood = draft.mood === d.m ? "" : d.m; route(); break;
    case "tActor": { const off = draft.actor === d.a; draft.actor = off ? "" : d.a; draft.role = off ? "" : d.r; draft.tags = []; draft.cmp = {}; draft.combo = []; route(); break; }  // 다시 누르면 해제(안 고른 상태로)
    case "tCmp": (draft.cmp ||= {})[d.b] = d.v; route(); break;
    case "tTag": draft.tags = draft.tags.includes(d.t) ? draft.tags.filter(x => x !== d.t) : [...draft.tags, d.t].slice(0, 3); route(); break;
    case "tPartner": draft.partner = d.a; route(); break;
    case "tCombo": draft.combo = draft.combo.includes(d.t) ? draft.combo.filter(x => x !== d.t) : [...draft.combo, d.t]; route(); break;
    case "tScore": draft.score = +d.n; route(); break;
    case "tView": draft.view = +d.n; route(); break;
    case "tSave": { const x = S.plans[draft.i];
      S.tags.push({at: today(), work: x.work, date: x.date, time: x.time, mood: draft.mood || "", role: draft.role, actor: draft.actor, tags: draft.tags, partner: draft.combo.length ? draft.partner : "", combo: draft.combo, score: draft.score, seat: $("#seat").value.trim(), view: draft.view || 0, note: $("#note").value.trim()});
      for (const [b, v] of Object.entries(draft.cmp || {})) if (v !== "skip") S.votes.push({at: today(), work: x.work, date: x.date, time: x.time, role: draft.role, a: draft.actor, b, result: v});
      x.tagged = true; S.draft = null; save(); mergeMyTags(); location.hash = "#me"; toast(draft.tags.length ? "저장했어요. 다음 추천에 반영돼요" : "저장했어요"); break; }
    case "copyTsv": { const text = exportRows().map(r => r.join("\t")).join("\n");
      (navigator.clipboard?.writeText(text) || Promise.reject()).then(() => toast("복사했어요"), () => { const r = document.createRange(); r.selectNodeContents($("pre")); getSelection().removeAllRanges(); getSelection().addRange(r); toast("드래그된 글을 복사하세요"); }); break; }
  }
});
document.addEventListener("input", e => { if (S.draft && (e.target.id === "note" || e.target.id === "seat")) S.draft[e.target.id] = e.target.value; });
document.addEventListener("keydown", e => { if (e.key === "Enter" && e.target.id === "fav") { e.preventDefault(); $("[data-act=addFav]").click(); } });
route();
</script>
</body>
</html>
